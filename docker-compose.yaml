
services: 
  mysql:
    container_name: mysql-db
    restart: always
    image: mysql:latest
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_USER=chanyut
      - MYSQL_PASS=chanyut.281144
      - MYSQL_DATABASE=order_system
      - MYSQL_ROOT_HOST='172.17.0.1'
    volumes:
      - db-mysql:/var/lib/mysql
    ports:
      - 3306:3306
  
  redis:
    image: redis:6.0.7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_volume_data:/data
    environment:
      - REDIS_PASSWORD=my-password
  
  redis_insight:
    image: redislabs/redisinsight:latest
    container_name: redis_insight
    restart: always
    ports:
      - 5530:5540
    volumes:
      - redis_insight_volume_data:/db
  
  backend: 
    container_name: order_system
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - mysql
    ports:
      - 8000:8000

volumes:
  db-mysql:
  redis_volume_data:
  redis_email_volume_data:
  redis_insight_volume_data:
  